name: Skill request
description: A fintech engineering task the plugin should handle
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What are you building or checking, and on which platform (Stripe, Razorpay, PayPal, Adyen, a bank API, your own ledger...)?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Tools, scripts or manual steps (optional).
